<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Received — VakeelSathi</title>
    <meta name="description" content="We've received your request. VakeelSathi's team will review it and get in touch with you directly.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#14213D">
    <link rel="canonical" href="https://vakeelsathi.in/thank-you.html">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: #1E2266;
            --ink-light: #4B4FA6;
            --ink-muted: #55586E;
            --paper: #F6F7FA;
            --panel: #EFF1F7;
            --rule: #D6D9E3;
            --stamp: #F5821F;
            --stamp-dark: #B85A0E;
            --brass: #1E2266;
            --radius: 4px;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--ink);
            line-height: 1.65;
            background-color: var(--paper);
        }

        h1, h2 {
            font-family: 'Zilla Slab', Georgia, serif;
            color: var(--ink);
            font-weight: 700;
            line-height: 1.15;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px 40px;
            background: linear-gradient(135deg, var(--ink) 0%, var(--ink-light) 100%);
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-family: 'Zilla Slab', serif;
            font-size: 21px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .logo-text sup {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 10px;
            margin-left: 2px;
            color: #FFFFFF;
        }

        .logo-img {
            height: 42px;
            width: 42px;
            display: block;
            background: #FFFFFF;
            border-radius: 50%;
            padding: 5px;
        }

        /* Confirmation panel */
        .confirmation {
            max-width: 560px;
            margin: 0 auto;
            padding: 88px 40px;
            text-align: center;
        }

        .filed-seal {
            width: 108px;
            height: 108px;
            margin: 0 auto 32px;
            border-radius: 50%;
            border: 2px solid var(--stamp);
            background: #FFFFFF;
            color: var(--stamp-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: rotate(-8deg);
            animation: stampDown 0.5s ease-out 0.15s backwards;
        }

        .filed-seal::before {
            content: "";
            position: absolute;
            inset: 8px;
            border: 1px dashed var(--stamp);
            border-radius: 50%;
        }

        .filed-seal {
            position: relative;
        }

        .filed-seal span {
            font-family: 'Zilla Slab', serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }

        @keyframes stampDown {
            0% { transform: rotate(-30deg) scale(1.7); opacity: 0; }
            70% { transform: rotate(-5deg) scale(0.95); opacity: 1; }
            100% { transform: rotate(-8deg) scale(1); opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .filed-seal {
                animation: none;
            }
        }

        .confirmation h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .confirmation p {
            font-size: 17px;
            color: var(--ink-muted);
            margin-bottom: 32px;
        }

        .btn {
            background: var(--stamp);
            color: var(--ink);
            padding: 15px 30px;
            border-radius: var(--radius);
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            transition: background-color 0.2s ease;
            display: inline-block;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--stamp-dark);
        }

        @media (max-width: 768px) {
            nav {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }

            .confirmation {
                padding: 56px 20px;
            }

            .confirmation h1 {
                font-size: 26px;
            }
        }

        /* Footer */
        footer {
            background: var(--ink);
            color: var(--paper);
            padding: 36px 40px;
            text-align: left;
            margin-top: 56px;
        }

        footer p {
            margin-bottom: 8px;
            color: #B7BAE0;
        }

        footer a {
            color: var(--stamp);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">
            <span class="logo-text">VakeelSathi<sup>™</sup></span>
            <img src="assets/logo.svg" alt="VakeelSathi" class="logo-img">
        </div>
    </nav>

    <!-- Confirmation -->
    <section class="confirmation">
        <div class="filed-seal" aria-hidden="true">
            <span>Request<br>Filed</span>
        </div>
        <h1>We've got your request</h1>
        <p>Thanks for reaching out — our team will review your request and get in touch with you directly.</p>
        <a href="index.html" class="btn">Back to home</a>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 VakeelSathi. Made in India. आपका कानूनी साथी</p>
        <p>
            <a href="privacy.html">Privacy Policy</a> |
            <a href="terms.html">Terms of Service</a> |
            support@vakeelsathi.in
        </p>
    </footer>
</body>
</html>
